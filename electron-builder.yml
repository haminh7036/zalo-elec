appId: com.haminh7036.zalo
productName: Zalo

files:
  - dist/**/*
  - resources/**/*
  - "!node_modules${/*}"
  - "!.git${/*}"
  - "!src${/*}"
  - "!tsconfig.json"
  - "!pnpm-lock.yaml"
  - "!pnpm-workspace.yaml"

linux:
  target:
    - deb
  category: Network
  icon: resources/icon.png
  desktop:
    entry:
      StartupWMClass: zalo-electron

# Single instance lock
protocols:
  - name: Zalo
    schemes: [zalo]
